services:
  app:
    build:
      context: .
      target: base
    # Custom container name as requested
    container_name: leadfunnel-server
    # Port Mapping: [HOST PORT]:[CONTAINER PORT]
    # You will access the app at http://localhost:3001
    ports:
      - "3001:3000"
    # Volumes for Hot Reloading
    volumes:
      - .:/app
      # This prevents your local node_modules from overwriting the container's node_modules
      - /app/node_modules
    # Command to enable Bun's watch mode for hot reloading
    command: bun --watch src/index.ts
    environment:
      - NODE_ENV=development
